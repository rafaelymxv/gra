<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz do Bebê Feliz! 👶💖</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-container">
    <h1>🍼 Quiz da Mamãe & Dindos 💕</h1>
    <p>Responda corretamente para manter o bebê feliz!</p>

    <div class="stats-board">
        <div class="stat">Felicidade: <span id="happy-score">100</span>%</div>
        <div class="stat">Pergunta: <span id="question-number">1</span>/10</div>
    </div>

    <div class="game-area">
        <div class="baby-display">
            <div class="baby-photo-frame">
                <img src="baby_photo.jpg" alt="Foto de um bebê fofo" class="baby-photo" id="baby-img">
            </div>
        </div>
        <div class="quiz-area">
            <p class="question-text" id="question-text">Pergunta...</p>
            <div class="options-grid" id="options-grid">
                </div>
        </div>
    </div>

    <div id="end-game-message" class="end-game-hidden">
        <h2 id="final-status">Parabéns!</h2>
        <button class="btn btn-reset" id="btn-reset">🔄 Jogar Novamente</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
