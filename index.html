<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino de Grávidas & Dindos! 👶💖</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-container">
    <h1>🍼 Treino de Mamãe & Dindos 💕</h1>
    <p>O bebê está sob os seus cuidados! Deixe-o feliz e preparado!</p>

    <div class="stats-board">
        <div class="stat">Felicidade: <span id="happy-score">50</span>%</div>
        <div class="stat">Nível: <span id="level">1</span> 🌟</div>
    </div>

    <div class="game-area">
        <div class="baby-emoji" id="baby">👶</div>
        <div class="status-text" id="status">O bebê está calminho! O que você vai fazer?</div>
    </div>

    <div class="actions-grid">
        <button class="btn" id="btn-milk">🍼 Dar Mamadeira</button>
        <button class="btn" id="btn-diaper">🧷 Trocar Fralda</button>
        <button class="btn" id="btn-lullaby">🎶 Cantar Cantiga</button>
        <button class="btn" id="btn-play">🧸 Fazer Cosquinha</button>
    </div>

    <button class="btn btn-reset" id="btn-reset">🔄 Reiniciar Treino</button>
</div>

<script src="script.js"></script>
</body>
</html>
